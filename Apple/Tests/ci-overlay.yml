  TekstilCADViewerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LosslessProjectNameTests.swift
      - path: Tests/ExperimentalPieceRenameTests.swift
      - path: Tests/ContourMeasureTests.swift
    dependencies:
      - target: TekstilCADViewer_iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.berkdemirokk.monoditreecad.tests
        SWIFT_VERSION: '5.0'
  TekstilCADViewerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ViewerUITests.swift
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: TekstilCADViewer_iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.berkdemirokk.monoditreecad.uitests
        TEST_TARGET_NAME: TekstilCADViewer_iOS
        SWIFT_VERSION: '5.0'
schemes:
  TekstilCADViewerCI:
    build:
      targets:
        TekstilCADViewer_iOS: all
        TekstilCADViewerTests: [test]
        TekstilCADViewerUITests: [test]
    test:
      targets:
        - TekstilCADViewerTests
        - TekstilCADViewerUITests
