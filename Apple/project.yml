name: TekstilCADViewer
options:
  deploymentTarget:
    iOS: '16.0'
    macOS: '13.0'
targets:
  TekstilCADViewer:
    type: application
    platform: [iOS, macOS]
    sources: [TekstilCADViewer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.berkdemirokk.monoditreecad
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SWIFT_VERSION: '5.0'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mono Di Tree CAD
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_CFBundleShortVersionString: '1.0'
        INFOPLIST_KEY_CFBundleVersion: '1'
        INFOPLIST_KEY_NSFileProviderUsageDescription: "Mono Di Tree CAD, Dosyalar uygulaması üzerinden .tcad projelerini açmak ve kaydetmek için dosya erişimine ihtiyaç duyar."
        INFOPLIST_KEY_UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.berkdemirokk.monoditreecad.tcad
            UTTypeDescription: Mono Di Tree CAD drawing
            UTTypeConformsTo:
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - tcad
        INFOPLIST_KEY_CFBundleDocumentTypes:
          - CFBundleTypeName: Mono Di Tree CAD Drawing
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.berkdemirokk.monoditreecad.tcad
              - public.content
            CFBundleTypeIconFiles:
              - AppIcon
