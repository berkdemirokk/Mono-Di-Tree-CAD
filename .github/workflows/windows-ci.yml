name: Windows build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
          roll-forward: latestPatch

      - name: Restore dependencies
        run: dotnet restore TekstilCAD.slnx --nologo

      - name: Build solution (Release)
        run: dotnet build TekstilCAD.slnx -c Release --nologo

      - name: Run unit tests
        run: dotnet test tests/TekstilCAD.Tests/TekstilCAD.Tests.csproj -c Release --no-build --nologo --logger trx --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: ./test-results
          if-no-files-found: ignore
          retention-days: 7
