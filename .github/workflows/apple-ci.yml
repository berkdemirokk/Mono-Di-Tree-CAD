name: iPhone simulator build and UI test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'Apple/**'
      - '.github/workflows/apple-ci.yml'
      - '!Apple/**/*.md'

permissions:
  contents: read

# Preserve CI capacity for the latest commit of each PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    # The UI suite ran past 30 minutes once the fourth round of tests was added
    # (137 tests passed before the job was cut off), so the budget is 60.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Apple
    steps:
      - uses: actions/checkout@v6
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate test project
        run: |
          cat project.yml Tests/ci-overlay.yml > project.ci.yml
          xcodegen generate --spec project.ci.yml
      - name: Choose an available iPhone simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          candidates = [(runtime, device) for runtime, devices in data["devices"].items()
                        if ".iOS-" in runtime for device in devices
                        if device["name"].startswith("iPhone") and device.get("isAvailable")]
          if not candidates:
              sys.exit("No available iPhone simulator")
          print(sorted(candidates, key=lambda item: (item[0], item[1]["name"]))[-1][1]["udid"])
          ')
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
      - name: Build and test on iPhone Simulator
        # The TEST_RUNNER_ prefix is stripped: the UI tests see SCREENSHOT_DIR.
        env:
          TEST_RUNNER_SCREENSHOT_DIR: ${{ runner.temp }}/iphone-screenshots
        run: >-
          xcodebuild -project TekstilCADViewer.xcodeproj
          -scheme TekstilCADViewerCI
          -configuration Debug
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}'
          -resultBundlePath "$RUNNER_TEMP/iPhoneTests.xcresult"
          CODE_SIGNING_ALLOWED=NO test
      - name: Collect screenshots for visual review
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/iphone-screenshots"
          xcrun simctl list devices available | grep "${{ steps.simulator.outputs.device_id }}" > "$RUNNER_TEMP/iphone-screenshots/device.txt" || true
          # Fallback when the test runner could not write the PNG files itself.
          if ! ls "$RUNNER_TEMP/iphone-screenshots"/*.png >/dev/null 2>&1; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/iPhoneTests.xcresult" --output-path "$RUNNER_TEMP/iphone-screenshots"
          fi
          ls -la "$RUNNER_TEMP/iphone-screenshots"
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-screenshots
          path: ${{ runner.temp }}/iphone-screenshots
          if-no-files-found: warn
          retention-days: 7
      # The tour writes its own PNG files, so the fallback above never exports the
      # screenshots XCTest keeps for failing tests. Export them separately on failure.
      - name: Export failure attachments
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/iphone-failures"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/iPhoneTests.xcresult" --output-path "$RUNNER_TEMP/iphone-failures" --only-failures || true
          ls -la "$RUNNER_TEMP/iphone-failures"
      - name: Save failure attachments
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-failures
          path: ${{ runner.temp }}/iphone-failures
          if-no-files-found: ignore
          retention-days: 7
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-test-results
          path: ${{ runner.temp }}/iPhoneTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
