name: iPhone simulator build and UI test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Apple
    steps:
      - uses: actions/checkout@v6
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate test project
        run: |
          cat project.yml Tests/ci-overlay.yml > project.ci.yml
          xcodegen generate --spec project.ci.yml
      - name: Choose an available iPhone simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          candidates = [(runtime, device) for runtime, devices in data["devices"].items()
                        if ".iOS-" in runtime for device in devices
                        if device["name"].startswith("iPhone") and device.get("isAvailable")]
          if not candidates:
              sys.exit("No available iPhone simulator")
          print(sorted(candidates, key=lambda item: (item[0], item[1]["name"]))[-1][1]["udid"])
          ')
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
      - name: Build and test on iPhone Simulator
        run: >-
          xcodebuild -project TekstilCADViewer.xcodeproj
          -scheme TekstilCADViewerCI
          -configuration Debug
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}'
          -resultBundlePath "$RUNNER_TEMP/iPhoneTests.xcresult"
          CODE_SIGNING_ALLOWED=NO test
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-test-results
          path: ${{ runner.temp }}/iPhoneTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
