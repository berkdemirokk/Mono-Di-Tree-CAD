name: Windows preview release

# Builds, tests and packages the Windows x64 preview. A pushed tag such as v0.4.0 or
# v0.4.0-preview.1 also publishes the packages as a GitHub pre-release. Packages are unsigned
# development previews: no code signature, installer or production certification.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check that the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [xml]$project = Get-Content src/TekstilCAD.Desktop/TekstilCAD.Desktop.csproj
          $version = "$($project.Project.PropertyGroup[0].Version)".Trim()
          if (!$version) { throw 'Project version is missing.' }
          if ($env:TAG -ne "v$version" -and !$env:TAG.StartsWith("v$version-")) {
            throw "Tag $($env:TAG) does not match project version $version. Use v$version or v$version-<label>."
          }

      - name: Build solution (Release)
        run: dotnet build TekstilCAD.slnx -c Release --nologo

      - name: Run unit tests
        run: dotnet test tests/TekstilCAD.Tests/TekstilCAD.Tests.csproj -c Release --no-build --nologo

      - name: Package source and Windows x64 archives
        shell: pwsh
        run: ./scripts/Package.ps1 -OutputDirectory (Join-Path $PWD 'work/packages')

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: tekstilcad-windows-x64-preview
          path: work/packages
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $notes = @(
            'Windows x64 geliştirme önizlemesi. Ticari üretim için tamamlanmış veya sertifikalı değildir.'
            ''
            '- `TekstilCAD-Windows-x64-*.zip`: ayrı bir klasöre açıp `TekstilCAD.Studio.exe` çalıştırın; .NET kurulumu gerekmez.'
            '- Paket imzasızdır; Windows SmartScreen veya Akıllı Uygulama Denetimi uyarı verebilir ya da çalıştırmayı engelleyebilir.'
            '- `TekstilCAD-manifest-*.json` arşivlerin SHA-256 özetlerini içerir.'
            '- Bilinen sınırlar: depodaki `KNOWN_ISSUES.md`.'
          ) -join "`n"
          Set-Content -LiteralPath work/release-notes.md -Value $notes -Encoding utf8
          $files = @(Get-ChildItem -LiteralPath work/packages -File | ForEach-Object FullName)
          if ($files.Count -lt 3) { throw 'Expected source archive, Windows archive and manifest.' }
          gh release create $env:TAG @files --prerelease --verify-tag --title "Mono Di Tree CAD $($env:TAG) (önizleme)" --notes-file work/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release could not be created.' }
